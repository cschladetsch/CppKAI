name: Deploy static content to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site content (excluding submodules)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _site | Out-Null

          $exclude = @('.git', '.github', 'Ext', '_site')
          $excludeThirdParty = 'Demo\ContinuationMobilityDemo\ThirdParty'

          Get-ChildItem -Path . -Force | Where-Object {
            $exclude -notcontains $_.Name
          } | ForEach-Object {
            Copy-Item -Path $_.FullName -Destination (Join-Path '_site' $_.Name) -Recurse -Force
          }

          $thirdPartyDest = Join-Path '_site' $excludeThirdParty
          if (Test-Path $thirdPartyDest) {
            Remove-Item -Path $thirdPartyDest -Recurse -Force
          }

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4name: Deploy static content to Pages



