      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Stage site content (excluding submodules)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path _site | Out-Null

          $exclude = @('.git', '.github', 'Ext', '_site')
          $excludeThirdParty = 'Demo\ContinuationMobilityDemo\ThirdParty'

          Get-ChildItem -Path . -Force | Where-Object {
            $exclude -notcontains $_.Name
          } | ForEach-Object {
            try {
              Copy-Item -Path $_.FullName -Destination (Join-Path '_site' $_.Name) -Recurse -Force -ErrorAction Stop
            } catch {
              Write-Warning "Skipped $($_.TargetObject ?? $_.FullName): $($_.Exception.Message)"
            }
          }

          $thirdPartyDest = Join-Path '_site' $excludeThirdParty
          if (Test-Path $thirdPartyDest) {
            Remove-Item -Path $thirdPartyDest -Recurse -Force
          }
