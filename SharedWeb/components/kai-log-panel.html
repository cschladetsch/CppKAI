<!-- Shared Log/Debug Panel -->
<div class="tab-panel">
  <div class="tab-list" role="tablist" aria-label="Debugger output">
    <button type="button" class="tab-button active" data-tab="debug">Debug</button>
    <button type="button" class="tab-button" data-tab="errors">Errors</button>
  </div>
  <div class="tab-pane active" id="tab-debug" role="tabpanel">
    <div id="debugOutput" class="output-list"></div>
  </div>
  <div class="tab-pane" id="tab-errors" role="tabpanel">
    <div id="errorOutput" class="output-list"></div>
  </div>
</div>
