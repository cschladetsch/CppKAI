<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Continuation Mobility Demo - Executor Workbench</title>
  <link rel="stylesheet" href="./style.css">
  <style>
    .workbench {
      display: grid;
      gap: 14px;
    }

    .editor-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .runtime-grid {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(240px, 0.82fr) minmax(260px, 0.95fr);
      gap: 14px;
      align-items: stretch;
    }

    @media (max-width: 1080px) {
      .editor-grid,
      .runtime-grid {
        grid-template-columns: 1fr;
      }
    }

    .work-panel {
      min-height: 0;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
    }

    .panel-title {
      font-family: "Cinzel", serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--gold);
    }

    .panel-note {
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
      white-space: nowrap;
    }

    .editor {
      min-height: 300px;
      flex: 1;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.18);
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      line-height: 1.6;
      overflow: auto;
      outline: none;
      white-space: pre-wrap;
      tab-size: 2;
    }

    .editor:focus {
      border-color: rgba(212,168,67,0.55);
      box-shadow: inset 0 0 0 1px rgba(212,168,67,0.18);
    }

    .editor[contenteditable="true"]:empty::before {
      content: attr(data-placeholder);
      color: var(--faint);
      font-style: italic;
    }

    .runtime-list {
      min-height: 220px;
      max-height: 360px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 7px;
      padding-right: 4px;
    }

    .stack-row,
    .context-row,
    .log-row {
      padding: 8px 10px;
      border-radius: 5px;
      border: 1px solid var(--line);
      background: rgba(212,168,67,0.03);
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
      cursor: help;
    }

    .stack-row.tos {
      color: var(--gold);
      border-color: rgba(212,168,67,0.5);
      background: rgba(212,168,67,0.1);
    }

    .row-label {
      color: var(--amber);
      font-weight: 600;
    }

    .mini-editor {
      min-height: 118px;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: rgba(0,0,0,0.18);
      color: var(--ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 12px;
      line-height: 1.55;
      overflow: auto;
      outline: none;
      white-space: pre-wrap;
    }

    .mini-editor:focus {
      border-color: rgba(212,168,67,0.55);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .toolbar button {
      margin-top: 0;
    }

    .empty-state {
      padding: 10px;
      border-radius: 5px;
      border: 1px dashed var(--line);
      color: var(--faint);
      font-size: 12px;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="page">
    <nav class="page-nav" title="Demo navigation tabs">
      <a class="page-link" href="./Registry.html" title="Open the registry view" data-tech="registry page">Registry</a>
      <a class="page-link" href="./ContinuationMobilityAnimation.html" title="Open the migration animation" data-tech="animated migration view">Migration View</a>
      <a class="page-link active" href="./ContinuationMobilityDemo.html" title="Open the executor workbench" data-tech="rho/pi executor workbench">System View</a>
      <a class="page-link" href="./Description.html" title="Open the RhoMog model description" data-tech="model description">The RhoMog Model</a>
      <a class="page-link" href="../DemoConintuationLocal/index.html" title="Open the local continuation stepper" data-tech="local continuation stepper">Local Stepper</a>
    </nav>

    <main class="workbench" data-tech="live Rho to Pi editor and simulated executor panels" title="Live Rho, Pi, executor stacks, and log output">
      <section class="editor-grid" title="Main source editors">
        <article class="work-panel" data-tech="rho source editor" title="Rho rich text editor">
          <div class="panel-head" title="Rho editor header">
            <h1 class="panel-title" title="Rho source panel" data-tech="rho">Rho</h1>
            <span class="panel-note" title="Rho changes update Pi automatically">Transpiles to Pi in real time</span>
          </div>
          <div id="rho-editor" class="editor" contenteditable="true" spellcheck="false"
               data-placeholder="Type Rho here..."
               title="Editable Rho source. Changes automatically regenerate the Pi panel."
               data-tech="contenteditable Rho input"></div>
        </article>

        <article class="work-panel" data-tech="pi continuation editor" title="Pi rich text editor">
          <div class="panel-head" title="Pi editor header">
            <h2 class="panel-title" title="Pi source panel" data-tech="pi">Pi</h2>
            <span class="panel-note" id="pi-mode" title="Pi is overwritten only when Rho changes">Editable; one-way dependency from Rho</span>
          </div>
          <div id="pi-editor" class="editor" contenteditable="true" spellcheck="false"
               data-placeholder="Pi output appears here..."
               title="Editable Pi continuation text. Rho edits replace this with fresh transpiled output."
               data-tech="contenteditable Pi output and manual input"></div>
        </article>
      </section>

      <section class="runtime-grid" title="Executor runtime panels">
        <article class="work-panel" data-tech="executor data stack and push editor" title="Executor data stack">
          <div class="panel-head" title="Data stack header">
            <h2 class="panel-title" title="Executor data stack panel" data-tech="Executor::GetDataStack()">Executor Data Stack</h2>
            <span class="panel-note" id="stack-count" title="Current data stack size">0 values</span>
          </div>
          <div id="data-stack" class="runtime-list" title="Deepest value is shown first; top of stack is [0] V0" data-tech="stack display, [0] is TOS"></div>
          <div class="panel-head" title="Stack input header">
            <h3 class="panel-title" title="Rich text stack input" data-tech="RTF stack parser">Push RTF</h3>
            <span class="panel-note" title="Tokens are parsed and pushed onto the executor stack">Parsed on push</span>
          </div>
          <div id="stack-input" class="mini-editor" contenteditable="true" spellcheck="false"
               title="Rich text input parsed into stack values. Use numbers, words, quoted text, or one token per line."
               data-tech="parse tokens then push to data stack">21
"resume"
Agent_1</div>
          <div class="toolbar" title="Executor data stack controls">
            <button class="primary" id="push-input" title="Parse the RTF editor and push values onto the executor data stack" data-tech="parseAndPush(input)">Push</button>
            <button id="pop-stack" title="Pop the top value from the executor data stack" data-tech="stack.pop()">Pop</button>
            <button id="clear-stack" title="Clear the executor data stack" data-tech="stack.clear()">Clear</button>
          </div>
        </article>

        <article class="work-panel" data-tech="executor continuation context stack" title="Executor context stack">
          <div class="panel-head" title="Context stack header">
            <h2 class="panel-title" title="Executor context stack panel" data-tech="Executor::GetContextStack()">Executor Context Stack</h2>
            <span class="panel-note" id="context-count" title="Current context stack size">0 frames</span>
          </div>
          <div id="context-stack" class="runtime-list" title="Continuation frames created from Pi and stack operations" data-tech="continuation context frames"></div>
          <div class="toolbar" title="Executor context controls">
            <button class="primary" id="run-pi" title="Run the current Pi continuation against the data stack" data-tech="executor.run(pi)">Run Pi</button>
            <button id="step-continuation" title="Advance one simulated continuation frame" data-tech="executor.step()">Step</button>
            <button id="clear-context" title="Clear all continuation context frames" data-tech="context.clear()">Clear</button>
          </div>
        </article>

        <article class="work-panel" data-tech="executor log output" title="Log output">
          <div class="panel-head" title="Log header">
            <h2 class="panel-title" title="Executor log output panel" data-tech="LogOutput">Log Output</h2>
            <span class="panel-note" id="log-count" title="Current log line count">0 lines</span>
          </div>
          <div id="log-output" class="runtime-list" title="Newest executor events appear first" data-tech="rolling executor log"></div>
          <div class="toolbar" title="Log controls">
            <button id="clear-log" title="Clear the log output panel" data-tech="log.clear()">Clear Log</button>
            <button id="reset-demo" title="Reset editors, stacks, contexts, and logs" data-tech="reset demo state">Reset Demo</button>
          </div>
        </article>
      </section>
    </main>
  </div>

  <script src="./demoStyle.js"></script>
  <script>
    const initialRho = [
      "System.Print(\"CONTINUATION MOBILITY\")",
      "",
      "workflow = fun(step, accumulator)",
      "    accumulator = accumulator + step",
      "    return accumulator",
      "",
      "workflow(3, 21)"
    ].join("\n");

    const state = {
      stack: [],
      contexts: [],
      logs: [],
      piEdited: false,
      tick: 0
    };

    const dom = {
      rho: document.getElementById("rho-editor"),
      pi: document.getElementById("pi-editor"),
      piMode: document.getElementById("pi-mode"),
      stack: document.getElementById("data-stack"),
      stackCount: document.getElementById("stack-count"),
      stackInput: document.getElementById("stack-input"),
      pushInput: document.getElementById("push-input"),
      popStack: document.getElementById("pop-stack"),
      clearStack: document.getElementById("clear-stack"),
      context: document.getElementById("context-stack"),
      contextCount: document.getElementById("context-count"),
      runPi: document.getElementById("run-pi"),
      stepContinuation: document.getElementById("step-continuation"),
      clearContext: document.getElementById("clear-context"),
      log: document.getElementById("log-output"),
      logCount: document.getElementById("log-count"),
      clearLog: document.getElementById("clear-log"),
      resetDemo: document.getElementById("reset-demo")
    };

    function textFromEditor(node) {
      return node.innerText.replace(/\u00a0/g, " ").replace(/\n+$/g, "");
    }

    function setEditorText(node, text) {
      node.textContent = text;
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function transpileRhoToPi(rhoText) {
      const lines = rhoText.split(/\r?\n/);
      const pi = ["// Pi continuation generated from Rho", "cont main {"];
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) continue;
        if (line.startsWith("//")) {
          pi.push("  " + line);
        } else if (line.startsWith("System.Print")) {
          pi.push("  emit " + line.replace(/^System\.Print/, "print"));
        } else if (line.includes(" = fun(")) {
          const name = line.split("=")[0].trim();
          const args = line.match(/fun\((.*)\)/);
          pi.push("  lambda " + name + "(" + (args ? args[1] : "") + ")");
        } else if (line.startsWith("return ")) {
          pi.push("  ret " + line.slice(7));
        } else if (/^[A-Za-z_][A-Za-z0-9_]*\(.*\)$/.test(line)) {
          pi.push("  call " + line);
        } else {
          pi.push("  eval " + line);
        }
      }
      pi.push("}");
      return pi.join("\n");
    }

    function parseStackInput(text) {
      const matches = text.match(/"[^"]*"|'[^']*'|[^\s,;]+/g) || [];
      return matches.map((token) => {
        const clean = token.replace(/^["']|["']$/g, "");
        const numeric = Number(clean);
        if (clean !== "" && Number.isFinite(numeric)) return { type: "Number", value: numeric };
        if (clean === "true" || clean === "false") return { type: "Bool", value: clean === "true" };
        return { type: "Symbol", value: clean };
      });
    }

    function log(message) {
      state.tick += 1;
      state.logs.unshift({ tick: state.tick, message });
      state.logs = state.logs.slice(0, 80);
      renderLogs();
    }

    function renderStack() {
      dom.stackCount.textContent = state.stack.length + (state.stack.length === 1 ? " value" : " values");
      if (state.stack.length === 0) {
        dom.stack.innerHTML = '<div class="empty-state" title="No data values are currently on the executor stack">Stack is empty</div>';
        return;
      }

      dom.stack.innerHTML = state.stack.map((item, index) => ({ item, index })).reverse().map(({ item, index }) => {
        const label = index === 0 ? "[0] TOS" : "[stack.size() - " + (state.stack.length - index) + "]";
        return '<div class="stack-row ' + (index === 0 ? "tos" : "") + '" title="Data stack entry ' + escapeHtml(label) + ' V' + index + '" data-tech="stack[' + index + ']">' +
          '<span class="row-label">' + escapeHtml(label) + ':</span> ' +
          escapeHtml(item.type) + " " + escapeHtml(item.value) +
          ' <span title="Top-relative value name">V' + index + '</span>' +
          '</div>';
      }).join("");
    }

    function renderContext() {
      dom.contextCount.textContent = state.contexts.length + (state.contexts.length === 1 ? " frame" : " frames");
      if (state.contexts.length === 0) {
        dom.context.innerHTML = '<div class="empty-state" title="No continuation frames are currently active">Context stack is empty</div>';
        return;
      }

      dom.context.innerHTML = state.contexts.map((frame, index) => (
        '<div class="context-row" title="Continuation context frame ' + index + '" data-tech="context[' + index + ']">' +
        '<span class="row-label">[' + index + '] ' + escapeHtml(frame.name) + ':</span> ' +
        escapeHtml(frame.detail) +
        '</div>'
      )).join("");
    }

    function renderLogs() {
      dom.logCount.textContent = state.logs.length + (state.logs.length === 1 ? " line" : " lines");
      if (state.logs.length === 0) {
        dom.log.innerHTML = '<div class="empty-state" title="No log entries have been emitted">No log output</div>';
        return;
      }

      dom.log.innerHTML = state.logs.map((entry) => (
        '<div class="log-row" title="Executor log entry ' + entry.tick + '" data-tech="log[' + entry.tick + ']">' +
        '<span class="row-label">#' + entry.tick + '</span> ' + escapeHtml(entry.message) +
        '</div>'
      )).join("");
    }

    function renderAll() {
      renderStack();
      renderContext();
      renderLogs();
      dom.piMode.textContent = state.piEdited ? "Manually edited; next Rho change will replace it" : "Editable; one-way dependency from Rho";
    }

    function refreshPiFromRho() {
      const piText = transpileRhoToPi(textFromEditor(dom.rho));
      setEditorText(dom.pi, piText);
      state.piEdited = false;
      dom.piMode.textContent = "Editable; one-way dependency from Rho";
      state.contexts.unshift({ name: "transpile", detail: "Rho source regenerated Pi continuation" });
      state.contexts = state.contexts.slice(0, 18);
      log("Rho transpiled to Pi");
      renderContext();
    }

    dom.rho.addEventListener("input", refreshPiFromRho);

    dom.pi.addEventListener("input", () => {
      state.piEdited = true;
      dom.piMode.textContent = "Manually edited; next Rho change will replace it";
    });

    dom.pushInput.addEventListener("click", () => {
      const values = parseStackInput(textFromEditor(dom.stackInput));
      if (values.length === 0) {
        log("Push ignored: RTF editor did not contain parseable values");
        return;
      }
      state.stack.unshift(...values.reverse());
      state.contexts.unshift({ name: "push", detail: values.length + " value(s) parsed from RTF input" });
      state.contexts = state.contexts.slice(0, 18);
      log("Pushed " + values.length + " value(s) onto executor data stack");
      renderAll();
    });

    dom.popStack.addEventListener("click", () => {
      const value = state.stack.shift();
      if (!value) {
        log("Pop ignored: data stack is empty");
      } else {
        state.contexts.unshift({ name: "pop", detail: "Removed " + value.type + " " + value.value });
        state.contexts = state.contexts.slice(0, 18);
        log("Popped top-of-stack value");
      }
      renderAll();
    });

    dom.clearStack.addEventListener("click", () => {
      state.stack = [];
      log("Executor data stack cleared");
      renderAll();
    });

    dom.runPi.addEventListener("click", () => {
      const piText = textFromEditor(dom.pi);
      const lineCount = piText.split(/\r?\n/).filter((line) => line.trim()).length;
      state.contexts.unshift({ name: "main", detail: lineCount + " Pi instruction(s), stack size " + state.stack.length });
      if (state.stack.length > 0) {
        const tos = state.stack[0];
        state.stack[0] = { type: "ContinuationResult", value: tos.value };
      }
      state.contexts = state.contexts.slice(0, 18);
      log("Ran Pi continuation against executor stack");
      renderAll();
    });

    dom.stepContinuation.addEventListener("click", () => {
      const frame = state.contexts.shift();
      if (!frame) {
        log("Step ignored: context stack is empty");
      } else {
        state.contexts.unshift({ name: frame.name, detail: "stepped continuation frame: " + frame.detail });
        log("Advanced one executor continuation frame");
      }
      renderAll();
    });

    dom.clearContext.addEventListener("click", () => {
      state.contexts = [];
      log("Executor context stack cleared");
      renderAll();
    });

    dom.clearLog.addEventListener("click", () => {
      state.logs = [];
      renderLogs();
    });

    dom.resetDemo.addEventListener("click", () => {
      state.stack = [];
      state.contexts = [];
      state.logs = [];
      state.piEdited = false;
      state.tick = 0;
      setEditorText(dom.rho, initialRho);
      setEditorText(dom.pi, transpileRhoToPi(initialRho));
      log("Demo reset");
      renderAll();
    });

    setEditorText(dom.rho, initialRho);
    setEditorText(dom.pi, transpileRhoToPi(initialRho));
    state.stack = [
      { type: "Number", value: 21 },
      { type: "Symbol", value: "Agent_1" },
      { type: "Bool", value: true }
    ];
    state.contexts = [
      { name: "main", detail: "ready to run generated Pi continuation" },
      { name: "rho", detail: "source editor owns one-way Pi regeneration" }
    ];
    log("Workbench initialized");
    renderAll();
  </script>
</body>
</html>
